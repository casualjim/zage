[package]
name = "zage"
version = "0.1.2"
edition = "2024"
description = "Shell history indexing and next-command suggestions with an online model"
license = "MIT"
repository = "https://github.com/casualjim/zage"
homepage = "https://github.com/casualjim/zage"

[package.metadata.release]
sign-commit = false
sign-tag = false
publish = false
allow-branch = ["main"]
pre-release-commit-message = "chore: Release {{crate_name}} version {{version}}"

[features]
tier1-tests = ["tempfile"]
pprof = ["dep:pprof"]

[dependencies]
bstr = { version = "1.12.1", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive", "env", "string", "unicode"] }
color-eyre = "0.6"
confique = { version = "0.4.0", features = ["toml"] }
deadpool = "0.12.3"
deadpool-libsql = "0.1.0"
dirs = "6.0.0"
dotnet-lens = "0.1.1"
foldhash = "0.2.0"
hostname = "0.4.2"
human-panic = "2.0"
humantime = "2.1"
itertools = "0.14.0"
jiff = "0.2.18"
libc = "0.2"
libsql = { version = "0.9.29", features = ["remote", "core", "replication", "encryption"] }
miette = { version = "7", features = ["fancy"] }
pprof = { version = "0.13.0", features = ["prost-codec"], optional = true }
rand = "0.9.2"
rayon = "1.10.0"
rkyv = { version = "0.7.46", features = ["validation"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
tempfile = { version = "3.24.0", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
toml_edit = { version = "0.22", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.26.3"
tree-sitter-bash = "0.25.1"
tree-sitter-zsh = "0.52.0"
uuid = { version = "1.19.0", features = ["fast-rng", "std", "v7"] }
uzers = "0.12"

# Force OpenSSL to use vendored version for Linux targets to avoid cross-compilation issues
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2"
color-backtrace = "0.7.2"
csv = "1.4"
ctor = "0.4"
liblzma = "0.4"
libtest-mimic = "0.8.1"
predicates = "3"
tempfile = "3.24.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[[test]]
name = "tier1"
path = "tests/tier1.rs"
harness = false
required-features = ["tier1-tests"]
