[package]
name = "zage"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.37", features = ["derive", "env", "string", "unicode"] }
color-eyre = "0.6"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
human-panic = "2.0"
clap-config-file = "0.5.0"
uuid = { version = "1.16.0", features = ["fast-rng", "std", "v7"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
bstr = { version = "1.9.0", features = ["serde"] }
libsql = { version = "0.6.0", features = ["remote", "core", "replication"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tree-sitter = "0.26.3"
tree-sitter-bash = "0.25.1"
tree-sitter-zsh = "0.52.0"
dirs = "6.0.0"
rand = "0.9.1"
uzers = "0.12"
hostname = "0.4.1"
itertools = "0.14.0"
jiff = "0.2.13"
burn = { version = "0.19.1", default-features = false, features = ["ndarray", "autodiff", "webgpu"] }
burn-core = { version = "0.19.1", default-features = false, features = ["std"] }
burn-ndarray = { version = "0.19.1", default-features = false, features = ["std"] }
burn-autodiff = { version = "0.19.1", default-features = false, features = ["std"] }
burn-wgpu = { version = "0.19.1", default-features = false, features = ["std"] }
toml = "0.9"

# Force OpenSSL to use vendored version for Linux targets to avoid cross-compilation issues
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3.20.0"
assert_cmd = "2"
predicates = "3"
color-backtrace = "0.7.0"
ctor = "0.4"
csv = "1.3"
xz2 = "0.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
