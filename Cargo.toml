[package]
name = "zage"
version = "0.1.0"
edition = "2024"

[dependencies]
bstr = { version = "1.9.0", features = ["serde"] }
clap = { version = "4.5.37", features = ["derive", "env", "string", "unicode"] }
clap-config-file = "0.5.0"
color-eyre = "0.6"
deadpool-libsql = "0.1.0"
dirs = "6.0.0"
foldhash = "0.2.0"
gbrt-rs = "0.2.0"
hostname = "0.4.1"
human-panic = "2.0"
itertools = "0.14.0"
jiff = "0.2.13"
libsql = { version = "0.9.29", features = ["remote", "core", "replication"] }
miette = { version = "7", features = ["fancy"] }
ndarray = "0.17.0"
rand = "0.9.1"
rkyv = { version = "0.7.44", features = ["validation"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.26.3"
tree-sitter-bash = "0.25.1"
tree-sitter-zsh = "0.52.0"
uuid = { version = "1.16.0", features = ["fast-rng", "std", "v7"] }
uzers = "0.12"

# Force OpenSSL to use vendored version for Linux targets to avoid cross-compilation issues
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2"
color-backtrace = "0.7.0"
csv = "1.3"
ctor = "0.4"
predicates = "3"
tempfile = "3.20.0"
xz2 = "0.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
