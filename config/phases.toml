[phases.build]
patterns = [
  "cargo build",
  "cargo check",
  "make",
  "cmake --build",
  "npm run build",
  "pnpm build",
  "bun build",
  "yarn build",
  "go build",
  "dotnet build",
  "mvn package",
  "gradle build",
  "mise build*"
]

[phases.test]
patterns = [
  "cargo test",
  "cargo nextest",
  "pytest",
  "npm test",
  "bun test",
  "pnpm test",
  "yarn test",
  "go test",
  "dotnet test",
  "mvn test",
  "gradle test",
  "bundle exec rspec",
  "mise test*"
]

[phases.deploy]
patterns = [
  "git push",
  "jj push",
  "kubectl apply",
  "kubectl rollout",
  "helm upgrade",
  "terraform apply",
  "tofu apply",
  "ansible-playbook",
  "docker push",
  "fly deploy",
  "mise deploy*"
]

[phases.edit]
patterns = [
  "vim",
  "nvim",
  "vi",
  "nano",
  "emacs",
  "code",
  "subl",
  "hx",
  "zed",
  "zeditor",
  "micro"
]
