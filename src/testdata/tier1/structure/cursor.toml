[meta]
description = "Verify cursor position affects completion prefix"
tags = ["structure", "cursor", "completion"]

[physics]
now = "2024-06-15T12:00:00Z"

[[history]]
cmd = "git checkout main"
at = "-1h"
cwd = "/tmp"
exit = 0
session = "s1"

[[history]]
cmd = "git status"
at = "-2h"
cwd = "/tmp"
exit = 0
session = "s1"

[[scenario]]
name = "cursor_prefix"
mode = "completion"
input = "git checkout main"
cursor = 4

[scenario.context]
cwd = "/tmp"
session = "s1"

[scenario.expect]
contains = ["git checkout", "git status"]
