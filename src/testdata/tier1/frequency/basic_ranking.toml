w_recency = 0.0
w_frequency = 1.0
w_transition = 0.0
w_context = 0.0
w_sequence = 0.0
w_similarity = 0.0

[[history]]
cmd = "rare_cmd"
at = "-1h"
cwd = "/tmp"
