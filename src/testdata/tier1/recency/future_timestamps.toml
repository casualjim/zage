[meta]
description = "Verify future timestamps clamp recency to zero"
tags = ["recency", "edge"]

[physics]
now = "2024-06-15T12:00:00Z"

[[history]]
cmd = "future_cmd"
at = "+1h"
cwd = "/tmp"
exit = 0
session = "s1"

[[scenario]]
name = "future_timestamp_recency"
mode = "completion"
input = "future"

[scenario.context]
cwd = "/tmp"
session = "s1"

[scenario.expect]
contains = ["future_cmd"]

[[scenario.expect.candidate]]
cmd = "future_cmd"
min_recency = 0.0
max_recency = 0.0
